apiVersion: 1

datasources:
  # uid is pinned so the provisioned dashboard can reference it. Without an
  # explicit uid Grafana generates a random one and every panel that hardcodes
  # a uid renders "Data source not found".
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
